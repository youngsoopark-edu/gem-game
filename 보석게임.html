<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보석 맞추기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #2b2350, #0c0a1a 70%);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #f3eefc;
  }
  .wrap { display: flex; gap: 20px; align-items: flex-start; padding: 16px; flex-wrap: wrap; justify-content: center; }
  .board { position: relative; max-width: calc(100vw - 32px); }
  .board canvas {
    display: block; width: 560px; max-width: 100%; height: auto;
    border-radius: 12px; border: 2px solid rgba(255,255,255,.2); touch-action: none;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 12px; background: rgba(10,8,25,.78);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .overlay h2 { margin: 0; font-size: 44px; color: #ffd86b; }
  .overlay .final { font-size: 26px; font-weight: bold; }
  .overlay .record { color: #7dffb0; font-weight: bold; }
  .panel {
    width: 200px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 1px; color: #ffd86b; text-shadow: 0 0 10px rgba(255,200,80,.5); }
  .label { font-size: 12px; opacity: .7; }
  .value { font-size: 26px; font-weight: bold; }
  .value.small { font-size: 18px; }
  .value.danger { color: #ff6b7a; }
  .bar { height: 10px; background: rgba(255,255,255,.12); border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #6bf, #c6f); transition: width .3s; }
  button {
    padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
    background: linear-gradient(#7a5cff, #5233d6); color: white; font-family: inherit;
  }
  button:hover { filter: brightness(1.15); }
  button.sub { background: rgba(255,255,255,.14); }
  .help { font-size: 12px; line-height: 1.6; opacity: .75; }
  .loading { opacity: .6; }
</style>
</head>
<body>
<div id="root"><p class="loading">불러오는 중...</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// =====================================================================
// 1. 상수 (PRD 4장 게임 규칙)
// =====================================================================
const N = 8;              // 8×8 보드
const CELL = 70;          // 칸 크기(px) → 보드 560×560
const TYPES = 7;          // 보석 7종류
const START_TIME = 90;    // 한 판 90초 (보너스로도 90초를 넘지 않음)
const HINT_COST = 20;     // 힌트 사용 시 -20점
const LEVEL_UP_TIME = 15; // 레벨업 시 +15초

// 보석 색 [밝은색, 어두운색] — 빨강 사각, 흰 원, 노랑 다이아, 초록 팔각, 주황 육각, 보라 삼각, 파랑 오각
const COLORS = [
  ['#ff4d5e', '#9e0f22'], ['#ffffff', '#8a93a8'], ['#ffe14d', '#b38900'], ['#3ee07a', '#0b7a35'],
  ['#ff9a3c', '#b04a00'], ['#d26bff', '#6b16a3'], ['#4db5ff', '#0b4fa0'],
];

// 레벨 n의 목표 누적 점수 = 1000 × n × (n+1) / 2
const levelGoal = (l) => 1000 * l * (l + 1) / 2;

// =====================================================================
// 2. 보드 로직 (순수 함수)
// =====================================================================
const rnd = (n) => Math.floor(Math.random() * n);
const createGem = (t, r, c) => ({ t, x: c, y: r, s: 1, a: 1 }); // x,y = 화면상 위치(칸 단위)

function createBoard() {
  const board = [];
  for (let r = 0; r < N; r++) {
    board.push([]);
    for (let c = 0; c < N; c++) {
      let t;
      do { t = rnd(TYPES); } while (
        (c >= 2 && board[r][c - 1].t === t && board[r][c - 2].t === t) ||
        (r >= 2 && board[r - 1][c].t === t && board[r - 2][c].t === t));
      board[r].push(createGem(t, r, c));
    }
  }
  return findMove(board) ? board : createBoard(); // 바꿀 수 있는 곳이 최소 1개
}

// 가로·세로로 3개 이상 이어진 같은 보석을 찾는다
function findMatches(board) {
  const set = new Set(), groups = [];
  const scan = (get) => {
    for (let i = 0; i < N; i++) for (let j = 0; j < N;) {
      let e = j;
      while (e + 1 < N && get(i, e + 1).t === get(i, j).t) e++;
      if (e - j >= 2) {
        const g = [];
        for (let k = j; k <= e; k++) { const key = get(i, k).key; set.add(key); g.push(key); }
        groups.push(g);
      }
      j = e + 1;
    }
  };
  scan((r, c) => ({ t: board[r][c].t, key: r * N + c })); // 가로
  scan((c, r) => ({ t: board[r][c].t, key: r * N + c })); // 세로
  return { set, groups };
}

function swapCells(board, a, b) {
  const t = board[a.r][a.c]; board[a.r][a.c] = board[b.r][b.c]; board[b.r][b.c] = t;
}

// 바꿔서 줄이 생기는 보석 한 쌍을 찾는다 (없으면 null)
function findMove(board) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {
    const b = { r: r + dr, c: c + dc };
    if (b.r >= N || b.c >= N) continue;
    swapCells(board, { r, c }, b);
    const ok = findMatches(board).set.size > 0;
    swapCells(board, { r, c }, b);
    if (ok) return [{ r, c }, b];
  }
  return null;
}

// 점수: 보석 1개당 10점, 4개 이상이면 3개를 넘는 보석 1개당 +30점, 연쇄 단계만큼 곱함
const groupScore = (g) => 10 * g.length + (g.length >= 4 ? 30 * (g.length - 3) : 0);

// =====================================================================
// 3. 애니메이션 도우미
// =====================================================================
const animate = (ms, fn) => new Promise((done) => {
  const t0 = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - t0) / ms);
    fn(p);
    p < 1 ? requestAnimationFrame(step) : done();
  };
  requestAnimationFrame(step);
});
const easeOut = (p) => 1 - Math.pow(1 - p, 3);

const loadBest = () => { try { return +localStorage.getItem('gemBest') || 0; } catch (e) { return 0; } };
const saveBest = (v) => { try { localStorage.setItem('gemBest', v); } catch (e) {} };

// =====================================================================
// 4. 게임 엔진 — 보드·애니메이션 상태는 여기서 관리하고,
//    점수·시간 같은 화면 표시값만 React state로 알려 준다(notify)
// =====================================================================
function createEngine(notify) {
  const s = {
    board: createBoard(), score: 0, level: 1, timeLeft: START_TIME, best: loadBest(),
    busy: false, gameOver: false, selected: null, hint: null, particles: [], popups: [],
  };

  const emit = () => notify({
    score: s.score, level: s.level, timeLeft: s.timeLeft, best: s.best, gameOver: s.gameOver,
    progress: (s.score - levelGoal(s.level - 1)) / (levelGoal(s.level) - levelGoal(s.level - 1)),
  });

  const popup = (x, y, text, life = 1) => s.popups.push({ x, y, text, life });

  const checkLevelUp = () => {
    while (s.score >= levelGoal(s.level)) {
      s.level++;
      s.timeLeft = Math.min(START_TIME, s.timeLeft + LEVEL_UP_TIME);
      popup(N * CELL / 2, N * CELL / 2 + 40, `레벨 업! Lv.${s.level} (+${LEVEL_UP_TIME}초)`, 1.6);
    }
  };

  const burst = (x, y, color) => {
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.5;
      s.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1, color, size: 2 + Math.random() * 3 });
    }
  };

  const animSwap = (ga, gb, a, b) => animate(180, (p) => {
    const e = easeOut(p);
    ga.x = a.c + (b.c - a.c) * e; ga.y = a.r + (b.r - a.r) * e;
    gb.x = b.c + (a.c - b.c) * e; gb.y = b.r + (a.r - b.r) * e;
  });

  async function shuffle() {
    const all = s.board.flat();
    await animate(250, (p) => all.forEach((g) => (g.a = 1 - p)));
    do {
      const types = all.map((g) => g.t).sort(() => Math.random() - 0.5);
      all.forEach((g, i) => (g.t = types[i]));
    } while (findMatches(s.board).set.size > 0 || !findMove(s.board));
    await animate(250, (p) => all.forEach((g) => (g.a = p)));
  }

  // 매치 제거 → 낙하 → 연쇄 반복
  async function resolve() {
    const { board } = s;
    for (let combo = 1; ; combo++) {
      const { set, groups } = findMatches(board);
      if (set.size === 0) break;

      const gained = groups.reduce((sum, g) => sum + groupScore(g), 0) * combo;
      s.score += gained;
      const bonus = groups.filter((g) => g.length >= 4).length * 2 + (combo >= 3 ? 1 : 0);
      s.timeLeft = Math.min(START_TIME, s.timeLeft + bonus);

      let sr = 0, sc = 0;
      set.forEach((k) => { sr += Math.floor(k / N); sc += k % N; });
      popup((sc / set.size + 0.5) * CELL, (sr / set.size + 0.5) * CELL, `+${gained}` + (combo > 1 ? `  x${combo}` : ''));

      const dying = [...set].map((k) => {
        const r = Math.floor(k / N), c = k % N;
        burst((c + 0.5) * CELL, (r + 0.5) * CELL, COLORS[board[r][c].t][0]);
        return board[r][c];
      });
      await animate(200, (p) => dying.forEach((g) => { g.s = 1 + 0.3 * p - 1.3 * p * p; g.a = 1 - p; }));
      set.forEach((k) => { board[Math.floor(k / N)][k % N] = null; });

      // 위의 보석을 떨어뜨리고 맨 위에 새 보석 생성
      const moving = [];
      for (let c = 0; c < N; c++) {
        let w = N - 1;
        for (let r = N - 1; r >= 0; r--) if (board[r][c]) {
          const g = board[r][c]; board[r][c] = null; board[w][c] = g;
          if (w !== r) moving.push({ g, from: g.y, to: w });
          w--;
        }
        for (let k = 0; w >= 0; w--, k++) {
          const g = createGem(rnd(TYPES), -1 - k, c);
          board[w][c] = g; moving.push({ g, from: g.y, to: w });
        }
      }
      const fall = Math.max(1, ...moving.map((m) => m.to - m.from));
      await animate(120 + 45 * fall, (p) => {
        const e = p * p * (3 - 2 * p);
        moving.forEach((m) => (m.g.y = m.from + (m.to - m.from) * e));
      });

      checkLevelUp();
      emit();
    }
    if (!findMove(board)) {
      popup(N * CELL / 2, N * CELL / 2, '섞는 중...', 1.5);
      await shuffle();
    }
  }

  function endGame() {
    s.gameOver = true; s.selected = null; s.hint = null;
    if (s.score > s.best) { s.best = s.score; saveBest(s.best); }
    emit();
  }

  const inside = (p) => p.r >= 0 && p.r < N && p.c >= 0 && p.c < N;
  const adjacent = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;

  return {
    state: s,
    emit,
    adjacent,

    newGame() {
      if (s.busy) return;
      Object.assign(s, {
        board: createBoard(), score: 0, level: 1, timeLeft: START_TIME,
        gameOver: false, selected: null, hint: null, particles: [], popups: [],
      });
      emit();
    },

    select(p) {
      if (s.busy || s.gameOver || !inside(p)) return false;
      s.selected = { r: p.r, c: p.c };
      return true;
    },

    async trySwap(a, b) {
      if (s.busy || s.gameOver || !inside(a) || !inside(b) || !adjacent(a, b)) return;
      s.busy = true; s.selected = null; s.hint = null;
      const ga = s.board[a.r][a.c], gb = s.board[b.r][b.c];
      await animSwap(ga, gb, a, b);
      swapCells(s.board, a, b);
      if (findMatches(s.board).set.size === 0) {
        await animSwap(ga, gb, b, a); // 줄이 안 생기면 되돌림
        swapCells(s.board, a, b);
      } else {
        await resolve();
      }
      s.busy = false;
      if (s.timeLeft <= 0) endGame();
    },

    showHint() {
      if (s.busy || s.gameOver) return;
      s.hint = findMove(s.board);
      s.score = Math.max(0, s.score - HINT_COST);
      emit();
    },

    tick() {
      if (s.gameOver) return;
      s.timeLeft = Math.max(0, s.timeLeft - 1);
      emit();
      if (s.timeLeft <= 0 && !s.busy) endGame();
    },
  };
}

// =====================================================================
// 5. 캔버스 그리기
// =====================================================================
function shapePath(ctx, t, R) {
  ctx.beginPath();
  const poly = (n, rot, rad = R) => {
    for (let i = 0; i < n; i++) {
      const a = rot + i * Math.PI * 2 / n;
      i ? ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad) : ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
  };
  switch (t) {
    case 0: { const h = R * 0.82; ctx.roundRect(-h, -h, h * 2, h * 2, R * 0.18); break; }
    case 1: ctx.arc(0, 0, R * 0.9, 0, Math.PI * 2); break;
    case 2: poly(4, -Math.PI / 2); break;
    case 3: poly(8, Math.PI / 8, R * 0.95); break;
    case 4: poly(6, 0, R * 0.95); break;
    case 5: ctx.moveTo(0, -R); ctx.lineTo(R * 0.95, R * 0.75); ctx.lineTo(-R * 0.95, R * 0.75); ctx.closePath(); break;
    case 6: poly(5, -Math.PI / 2); break;
  }
}

function drawGem(ctx, g, highlight) {
  const R = CELL * 0.38;
  ctx.save();
  ctx.translate((g.x + 0.5) * CELL, (g.y + 0.5) * CELL);
  const pulse = highlight ? 1 + Math.sin(performance.now() / 120) * 0.08 : 1;
  ctx.scale(g.s * pulse, g.s * pulse);
  ctx.globalAlpha = Math.max(0, g.a);
  const [light, dark] = COLORS[g.t];
  ctx.shadowColor = light; ctx.shadowBlur = highlight ? 22 : 8;
  shapePath(ctx, g.t, R);
  const grad = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R * 1.2);
  grad.addColorStop(0, '#fff'); grad.addColorStop(0.25, light); grad.addColorStop(1, dark);
  ctx.fillStyle = grad; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke();
  ctx.save(); ctx.scale(0.55, 0.55); shapePath(ctx, g.t, R);               // 안쪽 면
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  ctx.beginPath(); ctx.ellipse(-R * 0.3, -R * 0.38, R * 0.22, R * 0.1, -0.6, 0, Math.PI * 2); // 반짝임
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill();
  ctx.restore();
}

function drawScene(ctx, s) {
  const W = N * CELL;
  ctx.clearRect(0, 0, W, W);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,.05)' : 'rgba(255,255,255,.1)';
    ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
  }
  if (s.selected) {
    ctx.strokeStyle = '#ffd86b'; ctx.lineWidth = 3;
    ctx.strokeRect(s.selected.c * CELL + 3, s.selected.r * CELL + 3, CELL - 6, CELL - 6);
  }
  const isOn = (list, r, c) => list && list.some((p) => p.r === r && p.c === c);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = s.board[r][c];
    if (g) drawGem(ctx, g, isOn(s.selected && [s.selected], r, c) || isOn(s.hint, r, c));
  }
  s.particles = s.particles.filter((p) => p.life > 0);
  for (const p of s.particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.025;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  s.popups = s.popups.filter((p) => p.life > 0);
  ctx.textAlign = 'center'; ctx.font = 'bold 26px "Malgun Gothic", sans-serif';
  for (const p of s.popups) {
    p.y -= 0.7; p.life -= 0.015;
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = '#ffe680'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// =====================================================================
// 6. React 훅 & 컴포넌트
// =====================================================================

// 엔진을 한 번 만들고, 화면 표시값(ui)을 React state로 받는다
function useGemGame() {
  const [ui, setUi] = useState(null);
  const engineRef = useRef(null);
  if (!engineRef.current) engineRef.current = createEngine(setUi);
  const engine = engineRef.current;

  useEffect(() => {
    engine.emit();
    const id = setInterval(engine.tick, 1000); // 1초마다 시간 감소
    return () => clearInterval(id);
  }, [engine]);

  return { engine, ui };
}

function GameBoard({ engine, children }) {
  const canvasRef = useRef(null);
  const dragStart = useRef(null);

  useEffect(() => { // 매 프레임 캔버스를 다시 그림
    const ctx = canvasRef.current.getContext('2d');
    let id;
    const loop = () => { drawScene(ctx, engine.state); id = requestAnimationFrame(loop); };
    loop();
    return () => cancelAnimationFrame(id);
  }, [engine]);

  const cellAt = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (N * CELL) / rect.width;
    const y = (e.clientY - rect.top) * (N * CELL) / rect.height;
    return { r: Math.floor(y / CELL), c: Math.floor(x / CELL), x, y };
  };

  const onPointerDown = (e) => {
    const p = cellAt(e);
    const sel = engine.state.selected;
    if (sel && engine.adjacent(sel, p)) { // 선택 후 이웃 클릭 → 교환
      engine.trySwap(sel, p);
      dragStart.current = null;
      return;
    }
    dragStart.current = engine.select(p) ? p : null;
  };

  const onPointerMove = (e) => { // 드래그 → 끈 방향의 이웃과 교환
    const start = dragStart.current;
    if (!start) return;
    const p = cellAt(e), dx = p.x - start.x, dy = p.y - start.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < CELL * 0.4) return;
    const target = Math.abs(dx) > Math.abs(dy)
      ? { r: start.r, c: start.c + Math.sign(dx) }
      : { r: start.r + Math.sign(dy), c: start.c };
    dragStart.current = null;
    engine.trySwap({ r: start.r, c: start.c }, target);
  };

  useEffect(() => {
    const up = () => (dragStart.current = null);
    window.addEventListener('pointerup', up);
    return () => window.removeEventListener('pointerup', up);
  }, []);

  return (
    <div className="board">
      <canvas ref={canvasRef} width={N * CELL} height={N * CELL}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove} />
      {children}
    </div>
  );
}

function GameOverOverlay({ score, best, onRestart }) {
  const isRecord = score > 0 && score >= best;
  return (
    <div className="overlay">
      <h2>시간 종료!</h2>
      <div className="final">점수: {score.toLocaleString()}</div>
      {isRecord && <div className="record">🎉 최고 점수 달성!</div>}
      <button onClick={onRestart}>다시 시작</button>
    </div>
  );
}

function Stat({ label, children, className = '' }) {
  return (
    <div>
      <div className="label">{label}</div>
      <div className={`value ${className}`}>{children}</div>
    </div>
  );
}

function LevelBar({ level, progress }) {
  return (
    <div>
      <div className="label">레벨 {level}</div>
      <div className="bar"><div style={{ width: `${Math.min(100, progress * 100)}%` }} /></div>
    </div>
  );
}

function SidePanel({ ui, onHint, onNewGame }) {
  return (
    <div className="panel">
      <h1>💎 보석 맞추기</h1>
      <Stat label="점수">{ui.score.toLocaleString()}</Stat>
      <LevelBar level={ui.level} progress={ui.progress} />
      <Stat label="남은 시간" className={ui.timeLeft <= 10 ? 'danger' : ''}>{Math.ceil(ui.timeLeft)}</Stat>
      <Stat label="최고 점수" className="small">{ui.best.toLocaleString()}</Stat>
      <button className="sub" onClick={onHint}>💡 힌트 (-{HINT_COST}점)</button>
      <button onClick={onNewGame}>새 게임</button>
      <div className="help">
        같은 보석 3개 이상을 가로·세로로 맞추세요.<br />
        클릭 또는 드래그로 이웃한 보석을 바꿉니다.<br />
        4개 이상, 연쇄 콤보는 점수와 시간 보너스!
      </div>
    </div>
  );
}

function App() {
  const { engine, ui } = useGemGame();
  if (!ui) return null;
  return (
    <div className="wrap">
      <GameBoard engine={engine}>
        {ui.gameOver && <GameOverOverlay score={ui.score} best={ui.best} onRestart={engine.newGame} />}
      </GameBoard>
      <SidePanel ui={ui} onHint={engine.showHint} onNewGame={engine.newGame} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
